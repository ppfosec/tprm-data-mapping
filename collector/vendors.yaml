# Vendor registry.
#
# `legal_candidates` are starting guesses only. The collector verifies each one and
# discovers additional documents by following links out of whichever page responds,
# so a wrong guess here costs nothing but a 404 in the log.

- id: anthropic
  name: Anthropic
  category: Model provider
  hq: United States
  hq_iso: US
  site: https://www.anthropic.com
  board:
    type: greenhouse
    token: anthropic
  legal_candidates:
    - /legal/privacy
    - /legal/commercial-terms

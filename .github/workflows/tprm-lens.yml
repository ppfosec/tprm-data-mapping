name: tprm-lens

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Optional deliberate model scan
        default: replay
        type: choice
        options: [replay, live, record]
      model:
        description: Model for a deliberate live scan
        default: claude-sonnet-5
        type: string

permissions:
  contents: read

concurrency:
  group: tprm-lens-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Deterministic quality gate
        run: python scripts/check.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ matrix.python-version == '3.12' }}
        with:
          name: tprm-lens-demo
          retention-days: 14
          path: |
            index.html
            site/
            data/tprm-intelligence.json
            out/trace.jsonl

  deliberate-scan:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'replay' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,live]"
      - name: Run deliberate scan
        env:
          TPRM_LENS_MODE: ${{ inputs.mode }}
          TPRM_LENS_MODEL: ${{ inputs.model }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m tprm_lens.cli run
          python scripts/embed_viewer.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tprm-lens-${{ inputs.mode }}-${{ github.run_id }}
          retention-days: 7
          path: |
            data/tprm-intelligence.json
            site/embedded.js
            fixtures/cassettes/
            out/trace.jsonl
      - name: Commit deliberately recorded cassettes
        if: ${{ inputs.mode == 'record' }}
        run: |
          git config user.name "tprm-lens"
          git config user.email "tprm-lens@users.noreply.github.com"
          git add fixtures/cassettes data/tprm-intelligence.json site/embedded.js
          git diff --staged --quiet || git commit -m "Re-record TPRM Lens judgments (${{ inputs.model }})"
          git push

  deploy:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

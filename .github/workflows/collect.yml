name: collect

# The backend. Runs nightly, commits what changed, and publishes the dashboard.
# Snapshots are committed rather than stored in a database on purpose: git gives
# dated, tamper-evident diffs of every wording change for free.

on:
  schedule:
    - cron: "17 3 * * *"        # 03:17 UTC daily
  workflow_dispatch:
    inputs:
      only:
        description: "Collect a single vendor id (blank = all)"
        required: false
        default: ""
      sample:
        description: "Job descriptions to read per vendor"
        required: false
        default: "26"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Install dependencies
        run: pip install -r collector/requirements.txt

      - name: Collect
        working-directory: collector
        env:
          # Optional. Without it, data-type classification falls back to the
          # regex heuristic in classify.py -- the collector still runs fine.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python collect.py \
            ${{ github.event.inputs.only && format('--only {0}', github.event.inputs.only) || '' }} \
            --sample ${{ github.event.inputs.sample || '26' }}

      - name: Report drift
        run: |
          {
            echo "## Drift since last run"
            echo
            if git diff --quiet -- data/snapshots; then
              echo "No wording changes in any tracked document."
            else
              echo '```'
              git diff --stat -- data/snapshots
              echo '```'
              echo
              echo "<details><summary>Full diff</summary>"
              echo
              echo '```diff'
              git diff -- data/snapshots | head -c 60000
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit
        run: |
          git config user.name  "data-drift-bot"
          git config user.email "actions@github.com"
          git add data
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            changed=$(git diff --cached --name-only -- data/snapshots | wc -l | tr -d ' ')
            git commit -m "collect: ${changed} document(s) changed" \
                       -m "$(git diff --cached --stat -- data/snapshots)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

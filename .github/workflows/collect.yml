name: collect

# The backend. Runs nightly, commits what changed, and publishes the dashboard.
# Snapshots are committed rather than stored in a database on purpose: git gives
# dated, tamper-evident diffs of every wording change for free.

on:
  schedule:
    - cron: "17 3 * * *"        # 03:17 UTC daily
  workflow_dispatch:
    inputs:
      only:
        description: "Collect a single vendor id (blank = all)"
        required: false
        default: ""
      sample:
        description: "Job descriptions to read per vendor"
        required: false
        default: "26"

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Install dependencies
        run: pip install -r collector/requirements.txt

      - name: Collect
        working-directory: collector
        env:
          # Optional. Without it, data-type classification falls back to the
          # regex heuristic in classify.py -- the collector still runs fine.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ONLY_VENDOR: ${{ github.event.inputs.only || '' }}
          SAMPLE_SIZE: ${{ github.event.inputs.sample || '26' }}
        run: |
          [[ "$ONLY_VENDOR" =~ ^[a-z0-9_-]*$ ]] || { echo "invalid vendor id"; exit 2; }
          [[ "$SAMPLE_SIZE" =~ ^[0-9]+$ ]] || { echo "sample must be an integer"; exit 2; }
          args=(--sample "$SAMPLE_SIZE")
          if [[ -n "$ONLY_VENDOR" ]]; then
            args+=(--only "$ONLY_VENDOR")
          fi
          python collect.py "${args[@]}"

      - name: Report drift
        run: |
          {
            echo "## Drift since last run"
            echo
            if git diff --quiet -- data/snapshots; then
              echo "No wording changes in any tracked document."
            else
              echo '```'
              git diff --stat -- data/snapshots
              echo '```'
              echo
              echo "<details><summary>Full diff</summary>"
              echo
              echo '```diff'
              git diff -- data/snapshots | head -c 60000
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refresh TPRM Lens Vendor Surface
        run: |
          pip install -e .
          TPRM_LENS_MODE=replay python -m tprm_lens.cli run
          python scripts/embed_viewer.py

      - name: Commit
        run: |
          git config user.name  "data-drift-bot"
          git config user.email "actions@github.com"
          git add data site/embedded.js
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            changed=$(git diff --cached --name-only -- data/snapshots | wc -l | tr -d ' ')
            git commit -m "collect: ${changed} document(s) changed" \
                       -m "$(git diff --cached --stat -- data/snapshots)"
            git push
          fi

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

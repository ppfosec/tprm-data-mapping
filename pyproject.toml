[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tprm-lens"
version = "0.1.0"
description = "A staged, evidence-grounded TPRM judgment demonstrator"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
live = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
tprm-lens = "tprm_lens.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
